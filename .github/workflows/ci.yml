# Lint, the generated-models check and the tests - on SQLite and on a Postgres built from the
# packaged schema file.
#
# NOT a call into minty-oliveandvine/.github, like minty-shared-py: a library has no service to
# boot. With two Python packages now, both become `py-package.yml` in that repo (a GitHub-visible
# change, so it waits for the owner's yes); until then each keeps this short job.
name: ci

on:
  push:
    branches: [main, development]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    services:
      postgres:
        # The same server the APIs' Postgres pass uses (.github's python-api.yml).
        image: postgres:15-alpine
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          # What every consumer runs (the four Django APIs and Flask).
          python-version: "3.13"
      - run: python -m pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - name: pytest (SQLite)
        run: pytest -q
      - name: pytest (Postgres from 01_schema_rebased.sql)
        env:
          MINTY_TEST_PG_URI: postgresql://postgres:postgres@localhost:5432/postgres
          MINTY_TEST_PG_DBNAME: ci_${{ github.run_id }}_${{ github.run_attempt }}
        run: pytest -q
